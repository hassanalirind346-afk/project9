<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">           
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100%;
            height: 100vh;
            background-color:aliceblue;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .left{
            width: 25%;
            height: 430px;
            background-color: rgb(255, 147, 75);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            border-radius: 10px 0px 0px 10px;
        }
        h1{
            padding-bottom: 30px;
            color: white;

        }
        p{
            color: white;
        }
        .icon{
            font-size: 35px;
            color: white;
            margin-bottom: 15px;
        }
        button{
            border-radius: 15px;
            padding: 10px 25px;
            border: 1px solid white;
            background: transparent;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            color: white;
            margin-top: 25px;
        }
        .right{
            background-color:white;
            width:25% ;
            height: 430px;
            padding: 0px 15px;     
            border-radius: 10px ;
        }
        .acb{
            color: black;
            display: flex;
            justify-content: center;
        
            
        }
        .ssocial-icon{
            gap: 45px;
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .ssocial-icon a{
            color: black;
            font-size: 22px;
            text-decoration: none;

        }
        .ssocial-icon a:hover{
            color: red;
        }
        input{
            width: 100%;
            height: 25px;
            border: none;
            background-color:rgb(231, 225, 225);
            margin: 5px 5px;
            padding: 10px;
            outline: none;
            
        }
        input[type="checkbox"]{
            width: 15px;
            height: 15px;
        }
       .abs{
            width: 100%;
            border-radius: 0px;
            color: white;
            background-color: rgb(255, 147, 75);
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <h1>Welcome Back!</h1> 
            <p>To keeps connected with us please login <br>
                 with your personal info</p>
                 <button type="submit">log in</button>
        </div>
        <div class="right">
            
            <h1 class="acb">Sign up</h1>
      <div class="ssocial-icon">
    <a href="card.html"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="#"><i class="fa-brands fa-twitter"></i></a>
    <a href="#"><i class="fa-brands fa-pinterest-p"></i></a>
    <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
     </div>
        <input type="text" placeholder="name">
        <input type="email" placeholder="email">
        <input type="password" placeholder="password">
        
        <input type="checkbox">accept terms
        <button class="abs"submit>REGISTER</button>
        

        </div>
    </div>
</body>
</html>
